<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rules and a short quiz for dash cam road survey drivers.">
<title>Dash Cam Drive Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&family=Overpass+Mono:wght@600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column, one card at a time. Top bar: Back, route progress with five stops, theme switch.
   Pictures: flat shapes, no outlines, one palette (navy, cream, amber, coral, sage). Coral = attention, amber = action, sage = correct. */
:root{
  --bg:#F6F1E7; --surface:#FFFDF8; --ink:#141B3C; --muted:#5B6078; --line:#E2D9C8;
  --brand:#F2A93B; --brand-ink:#141B3C; --amber:#F2A93B; --coral:#D94A22; --sage:#5E8F88;
  --ok-bg:#E4EFEC; --bad-bg:#FBE7E0; --scene-edge:transparent;
  --f-display:"Overpass","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1228; --surface:#171D3A; --ink:#F3EBDD; --muted:#A9AEC6; --line:#2B3359;
  --brand:#F2A93B; --brand-ink:#141B3C; --coral:#FF7A52; --sage:#7DB3AB;
  --ok-bg:#1C3537; --bad-bg:#3D2320; --scene-edge:#2B3359; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1228; --surface:#171D3A; --ink:#F3EBDD; --muted:#A9AEC6; --line:#2B3359;
  --brand:#F2A93B; --brand-ink:#141B3C; --coral:#FF7A52; --sage:#7DB3AB;
  --ok-bg:#1C3537; --bad-bg:#3D2320; --scene-edge:#2B3359; color-scheme:dark }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* pages: swipe sideways to change card (start page and cards only, not the quiz).
   The neighbour page (peek) is drawn beside the current one while the finger moves. */
.pager{position:relative;overflow:hidden}
@supports (overflow:clip){.pager{overflow:visible;overflow-x:clip}}
#view{touch-action:pan-y pinch-zoom}
.peek{position:absolute;left:0;top:0;width:100%;pointer-events:none}
/* page swipe hint (touch screens, first card of a visit): a hand drags the page sideways and it springs back */
.phint .cn{fill:var(--brand-ink);opacity:.16}
.phint{position:fixed;left:0;top:0;width:0;height:0;z-index:6;pointer-events:none;opacity:0;transition:opacity .25s}
.phint.on{opacity:1}
.phint .phand{position:absolute;left:-22px;top:-6px;width:58px;height:64px;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.phint .phand svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .18s;transform-origin:38% 10%}
.phint.press .phand svg{transform:scale(.85)}
.phint .co{fill:var(--brand-ink)} .phint .cf{fill:var(--amber)} .phint .cl{fill:var(--brand-ink);opacity:.45}
.phint .phcap{position:absolute;left:0;top:-54px;transform:translateX(-50%);white-space:nowrap;background:var(--brand);color:var(--brand-ink);
  border-radius:999px;padding:8px 14px 6px;font-family:var(--f-display);font-weight:800;font-size:15px}
/* Next / Back buttons: the new page slides in from the side it came from */
#view.inR{animation:inR .22s ease-out}
#view.inL{animation:inL .22s ease-out}
@keyframes inR{from{transform:translateX(30px);opacity:.25}}
@keyframes inL{from{transform:translateX(-30px);opacity:.25}}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.back{font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px 7px;cursor:pointer;display:flex;align-items:center;gap:6px}
.back svg{width:13px;height:13px}
.where{flex:1;min-width:0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.where b{display:block;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.theme{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme svg{width:22px;height:22px}

/* route progress: five stages, one dot per card. The fill runs to the current card.
   Tap a dot, or drag along the strip, to open any card. The quiz part has no dots and cannot be tapped.
   Column widths follow the number of cards in each stage (set in the script), at least 44 px so the labels fit. */
.route{display:grid;gap:0;position:relative;padding-block:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.leg{display:flex;flex-direction:column;gap:6px;min-width:0}
.leg .rail{position:relative;height:16px}
.leg .rail::before{content:"";position:absolute;left:7px;right:-7px;top:6px;height:4px;border-radius:2px;background:var(--line)}
.leg:last-child .rail::before{right:7px}
.leg .fill{position:absolute;left:7px;top:6px;height:4px;border-radius:2px;background:var(--amber);width:0;transition:width .35s ease}
.dot{position:absolute;top:50%;width:8px;height:8px;padding:0;margin:0;border-radius:50%;background:var(--surface);border:2px solid var(--line);
  transform:translate(-50%,-50%);z-index:1;cursor:pointer;transition:width .2s,height .2s,background-color .2s,border-color .2s}
.dot.seen{background:var(--amber);border-color:var(--amber)}
.dot.now{width:14px;height:14px;background:var(--amber);border:2.5px solid var(--ink)}
.leg span{font-family:var(--f-display);font-weight:800;font-size:10px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.leg.now span{color:var(--ink)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.stage{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--amber);border-radius:999px;padding:5px 12px 3px}
h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:29px;line-height:1.1;text-wrap:balance}
h1:focus{outline:none}
h1.q{font-size:23px;line-height:1.2}
.scene{border-radius:14px;overflow:hidden;background:#F3EBDD;box-shadow:0 0 0 1px var(--scene-edge)}
.scene svg{display:block;width:100%;height:auto}
.lead{margin:0;font-size:18px}
ul.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.pts li{position:relative;padding-left:24px}
ul.pts li::before{content:"";position:absolute;left:2px;top:.55em;width:12px;height:4px;border-radius:2px;background:var(--amber)}
.no{color:var(--coral);font-weight:700}
.note{font-size:15px;color:var(--muted);margin:0}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tap{align-self:flex-start;font-family:var(--f-display);font-weight:800;font-size:16px;cursor:pointer;background:var(--brand);color:var(--brand-ink);border:0;border-radius:999px;padding:11px 20px 9px;text-align:left}
.seg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.seg button{min-width:56px;font-family:var(--f-display);font-weight:800;font-size:16px;cursor:pointer;border-radius:999px;padding:9px 16px 7px;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0;padding:0;list-style:none}
.steps li{padding:5px 12px 3px;border-radius:999px;border:1.5px solid var(--line);font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--muted)}
.steps li.done{border-color:var(--sage);color:var(--ink);background:var(--ok-bg)}

.nav{display:flex}
.primary{flex:1;font-family:var(--f-display);font-weight:800;font-size:17px;border-radius:12px;padding:14px 20px 12px;cursor:pointer;border:0;background:var(--brand);color:var(--brand-ink)}
.primary:disabled{opacity:.4;cursor:default}

.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.keys li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.keys li > div{min-width:0}
.keys svg{width:34px;height:34px}
.keys b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.25}
.keys span{display:block;color:var(--muted);font-size:15px}
.keys.short span{display:none}
.keys.short li{align-items:center}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.reset{font-family:var(--f-display);font-weight:800;font-size:14px;border-radius:999px;padding:6px 14px 4px;cursor:pointer;background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.reset.alert{background:var(--coral);border-color:var(--coral);color:var(--surface)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;cursor:pointer;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:14px 16px;line-height:1.35}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber);background:rgba(242,169,59,.16);font-weight:700}
.opt.right{border-color:var(--sage);background:var(--ok-bg)}
.opt.wrong{border-color:var(--coral);background:var(--bad-bg)}
.fb{border-radius:12px;padding:12px 14px;margin:0}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--sage)}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--coral)}
.fb b{display:block;font-family:var(--f-display)}
label{font-weight:700}
input[type=text]{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.cert{border:3px solid var(--amber);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px;text-align:center}
.cert svg{width:56px;height:56px;margin:0 auto}
.cert .who{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.2;overflow-wrap:anywhere}
.cert .when{font-family:var(--f-mono);font-size:15px;color:var(--muted)}

/* motion */
@keyframes lane{to{stroke-dashoffset:92}} .lane{animation:lane 1.1s linear infinite} .lane-slow{animation:lane 3s linear infinite}
@keyframes lanev{to{stroke-dashoffset:-15}} .lanev{animation:lanev .5s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.3px)}} .bob{animation:bob .6s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.2}} .blink{animation:blink 1s steps(1) infinite}
@keyframes pulse{0%,100%{opacity:.18}50%{opacity:.38}} .pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
.still .wheel{animation:none}
.hand{animation:spin 8s linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(420px)}} .drift{animation:drift 38s linear infinite}
@keyframes pop{0%,8%{transform:scale(0);opacity:0}20%{transform:scale(1.1);opacity:1}28%,86%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 3.6s ease-out infinite}
@keyframes tickin{0%,35%{transform:scale(0)}55%{transform:scale(1.15)}70%,100%{transform:scale(1)}}
.tickin{transform-box:fill-box;transform-origin:center;animation:tickin 1.2s ease-out both}
@keyframes drop{0%{transform:translateY(-46px);opacity:0}60%{transform:translateY(3px);opacity:1}100%{transform:translateY(0)}}
.drop{animation:drop .8s cubic-bezier(.3,1.4,.5,1) both}
@keyframes needle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}} .needle{animation:needle 2.8s ease-in-out infinite}
@keyframes jam{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}} .jam{animation:jam 2.4s ease-in-out infinite}
@keyframes roll{to{transform:translateY(-270px)}} .roll{animation:roll 9s steps(9) infinite}
@keyframes flash{0%,78%,100%{opacity:0}82%{opacity:.9}} .flash{animation:flash 2.6s linear infinite}
@keyframes wave{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.wave{transform-box:fill-box;transform-origin:left center;animation:wave 1.4s ease-out infinite} .w2{animation-delay:.45s}
@keyframes shake{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-7deg)}88%{transform:rotate(7deg)}92%{transform:rotate(-4deg)}96%{transform:rotate(3deg)}}
.shake{transform-box:fill-box;transform-origin:center;animation:shake 2.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}} .nudge{animation:nudge 1.3s ease-in-out infinite}
@keyframes vf{0%,100%{opacity:.55}50%{opacity:1}} .vf{animation:vf 1.8s ease-in-out infinite}
@keyframes lanev2{to{stroke-dashoffset:-30}} .lanev2{animation:lanev2 .7s linear infinite}
@keyframes tug{0%,12%{transform:translateX(0);opacity:1}50%,78%{transform:translateX(17px);opacity:1}86%{transform:translateX(17px);opacity:0}87%{transform:translateX(0);opacity:0}100%{transform:translateX(0);opacity:1}} .tug{animation:tug 3.8s ease-in-out infinite}
@keyframes stopsign{0%,34%{transform:scale(.4);opacity:0}48%{transform:scale(1.12);opacity:1}56%,80%{transform:scale(1);opacity:1}90%,100%{transform:scale(1);opacity:0}} .stopsign{transform-box:fill-box;transform-origin:center;animation:stopsign 3.8s ease-out infinite}
@keyframes dash{to{stroke-dashoffset:-34}} .dash{animation:dash 1s linear infinite}
@keyframes trip{0%{transform:translateX(0) scaleX(1)}34%{transform:translateX(222px) scaleX(1)}36%{transform:translateX(222px) scaleX(-1)}64%{transform:translateX(0) scaleX(-1)}66%,100%{transform:translateX(0) scaleX(1)}}
@keyframes tripB{0%{transform:translateX(222px) scaleX(-1)}34%{transform:translateX(0) scaleX(-1)}36%{transform:translateX(0) scaleX(1)}64%,100%{transform:translateX(222px) scaleX(1)}}
.trip{transform-box:fill-box;transform-origin:center;animation:trip 8s ease-in-out infinite}
[data-start="B"] .trip{animation-name:tripB}
@keyframes timesup{0%,16%{opacity:0;transform:translateY(6px)}20%,42%{opacity:1;transform:translateY(0)}46%,100%{opacity:0}} .timesup{animation:timesup 8s ease-out infinite}
@keyframes finish{0%,64%{opacity:0;transform:scale(.6)}70%,96%{opacity:1;transform:scale(1)}100%{opacity:0}}
.finish{transform-box:fill-box;transform-origin:center bottom;animation:finish 8s ease-out infinite}
[data-start="A"] .forB,[data-start="B"] .forA{display:none}
/* plug system: s=0 nothing connected, s=1 cameras in adapter, s=2 adapter in car (recording) */
.camplugs,.carplug,.lead{transition:transform .55s cubic-bezier(.3,1.25,.5,1)}
.lead{transform-box:view-box;transform-origin:176px 155px}
[data-s="2"] .lead{transform:scaleY(1.889)}
[data-s="1"] .camplugs,[data-s="2"] .camplugs{transform:translateY(12px)}
[data-s="2"] .carplug{transform:translateY(16px)}
.on{opacity:0;transition:opacity .3s .45s} [data-s="2"] .on{opacity:1}
.off{transition:opacity .2s .4s} [data-s="2"] .off{opacity:0}
</style>
</head>
<body>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <div class="bar">
      <button class="back" id="backBtn" hidden aria-label="Go back one page"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 L4 7 L9 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
      <div class="where"><b>Dash Cam Drive Guide</b><span id="count"></span></div>
      <button class="theme" id="themeBtn" type="button"></button>
    </div>
    <nav class="route" id="route" aria-label="Cards"></nav>
  </header>
  <div class="pager" id="pager"><main id="view" aria-live="polite"></main><div class="peek" id="peek" aria-hidden="true" inert hidden></div></div>
</div>

<script>
(function(){
/* ---------- palette + drawing helpers ---------- */
const N='#141B3C',N2='#33407A',N3='#232B52',NK='#0A0E22',CR='#F3EBDD',W='#FFFDF8',AM='#F2A93B',AM2='#DB932A',CO='#E4572E',CO2='#C4441F',SG='#5E8F88',SK='#DCE9E8',SK2='#C9DBD8',SD='#D8C9AE',SD2='#C4B393',SD3='#BCA988',GY='#B8BCC8',MT='#B9CFCB';
const R=(x,y,w,h,rx,f,e='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${f}" ${e}/>`;
const C=(cx,cy,r,f,e='')=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${e}/>`;
const T=(x,y,s,t,f=N,mono=0,a='middle')=>`<text x="${x}" y="${y}" text-anchor="${a}" font-family="${mono?'Overpass Mono, monospace':'Overpass, Arial, sans-serif'}" font-weight="${mono?600:800}" font-size="${s}" fill="${f}">${t}</text>`;
const svg=(label,inner,h=220)=>`<svg viewBox="0 0 360 ${h}" role="img" aria-label="${label}">${inner}</svg>`;
const check=(x,y,r=9)=>`<g>${C(x,y,r,SG)}<path d="M${x-r*.45} ${y} L${x-r*.1} ${y+r*.36} L${x+r*.5} ${y-r*.36}" fill="none" stroke="${W}" stroke-width="${r*.28}" stroke-linecap="round" stroke-linejoin="round"/></g>`;
const no=(cx,cy,r)=>`<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CO}" stroke-width="6"/><line x1="${cx-r*.7}" y1="${cy-r*.7}" x2="${cx+r*.7}" y2="${cy+r*.7}" stroke="${CO}" stroke-width="6" stroke-linecap="round"/></g>`;
const qmark=(x,y)=>`<g class="pop" style="animation-duration:3s">${C(x,y,17,W)}${T(x,y+8,23,'?',CO)}</g>`;
const arc=(cx,cy,r,a0,a1,col,w=7)=>{const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)].map(v=>v.toFixed(1)).join(' ');return `<path d="M${p(a0)} A${r} ${r} 0 0 1 ${p(a1)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;};
const carSym=(id,body,shade,cams,spin=1)=>`<symbol id="${id}" viewBox="0 0 204 98"><ellipse cx="102" cy="92" rx="94" ry="5" fill="${NK}" opacity=".28"/>
  <path d="M10 72 L10 50 Q10 42 18 41 L36 38 L54 18 Q58 12 68 12 L124 12 Q132 12 138 18 L158 40 L182 44 Q194 46 194 58 L194 72 Q194 76 190 76 L14 76 Q10 76 10 72 Z" fill="${body}"/>
  <path d="M10 62 L194 62 L194 72 Q194 76 190 76 L14 76 Q10 76 10 72 Z" fill="${shade}"/>
  <path d="M60 21 L47 38 L92 38 L92 20 L63 20 Q61 20 60 21 Z" fill="#D5E6E4"/><path d="M98 20 L98 38 L151 38 L135 22 Q133 20 130 20 Z" fill="#D5E6E4"/>
  <path d="M108 20 L120 20 L106 38 L98 38 L98 33 Z" fill="#FFFFFF" opacity=".55"/>
  ${cams?R(121,21.5,10,6,2,N2)+R(125,21.5,10,6,2,N)+C(134,24.5,1.6,AM):''}
  <rect x="94.2" y="20" width="1.6" height="40" fill="${N}" opacity=".22"/>${R(104,45,11,3,1.5,N,'opacity=".45"')}${R(62,45,11,3,1.5,N,'opacity=".45"')}
  ${R(185,50,9,7,2.5,AM)}${R(10,47,5,9,2,'#8F2A14')}
  ${[48,154].map(cx=>C(cx,76,15,N)+C(cx,76,7,CR)+`<g class="${spin?'wheel':''}">${R(cx-7,75,14,2,0,N)}${R(cx-1,69,2,14,0,N)}</g>`+C(cx,76,2.2,N)).join('')}</symbol>`;
const DEFS=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>${carSym('car',CO,CO2,1)}${carSym('carB',SG,'#4C7A73',0)}${carSym('carC',N2,'#2A3567',0)}${carSym('carS',CO,CO2,1,0)}${carSym('carBS',SG,'#4C7A73',0,0)}</defs></svg>`;
const use=(id,x,y,w,cls='')=>`<g class="${cls}"><use href="#${id}" x="${x}" y="${y}" width="${w}" height="${w*98/204}"/></g>`;
/* outside world: cream sky, sun, hills, road */
const outside=(ry=156,sun=1)=>`${R(0,0,360,220,0,CR)}${sun?C(284,56,30,'#F7D9A0'):''}<path d="M0 ${ry-14} Q60 ${ry-44} 130 ${ry-24} T260 ${ry-32} T360 ${ry-22} L360 ${ry+4} L0 ${ry+4}Z" fill="#E6D8BF"/>${R(0,ry,360,220-ry,0,N)}${R(0,ry,360,3,0,'#2A3567')}`;

const QUIZ=[
  {q:"Where do you mount the two cameras?",o:["On the dashboard, wherever they fit","At the top of the windscreen, next to the rear-view mirror","In the bottom corner of the windscreen"],a:1,why:"As high as you can, next to the rear-view mirror, lenses pointing straight ahead. They must be stable and not block your view."},
  {q:"When can you start driving?",o:["As soon as the adapter is plugged in","After you have driven for a minute","When both screens show REC and a red dot"],a:2,why:"Check both cameras. If one is not recording, the video for that time is lost."},

  {q:"The traffic is very slow. What do you do?",o:["Keep going on your route","Take a faster road","Stop and wait for the traffic to clear"],a:0,why:"Traffic jams are normal at busy times. They are part of the data. Keep going."},

  {q:"You are on a three-lane road. Which lane do you use?",o:["The far right lane, all the way","The kerb lane or the second lane","Any lane, and change lanes often"],a:1,why:"Drive in the kerb lane or the second lane. Use the far right lane only when your route turns right."}

const KICON={

/* ---------- theme switch: follows the system until the viewer taps it ---------- */
const root=document.documentElement, themeBtn=document.getElementById('themeBtn');
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const SUN=`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.6" fill="currentColor"/>${[0,45,90,135,180,225,270,315].map(a=>`<line x1="${12+7.6*Math.cos(a*Math.PI/180)}" y1="${12+7.6*Math.sin(a*Math.PI/180)}" x2="${12+10.2*Math.cos(a*Math.PI/180)}" y2="${12+10.2*Math.sin(a*Math.PI/180)}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>`).join('')}</svg>`;
const MOON=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5 A8.5 8.5 0 1 1 9.5 4 A6.8 6.8 0 0 0 20 14.5 Z" fill="currentColor"/></svg>`;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':!!(mq&&mq.matches);
const paintTheme=()=>{const d=isDark();themeBtn.innerHTML=d?SUN:MOON;themeBtn.setAttribute('aria-label',d?'Switch to daylight mode':'Switch to dark mode');themeBtn.title=d?'Switch to daylight mode':'Switch to dark mode';};
themeBtn.onclick=()=>{root.dataset.theme=isDark()?'light':'dark';paintTheme();};
if(mq&&mq.addEventListener) mq.addEventListener('change',paintTheme);
new MutationObserver(paintTheme).observe(root,{attributes:true,attributeFilter:['data-theme']});
paintTheme();

/* ---------- flow ---------- */
const N_=CARDS.length,Q=QUIZ.length;
const view=document.getElementById('view'),backBtn=document.getElementById('backBtn'),routeEl=document.getElementById('route');
let step=0,qi=0,quizStarted=false,name='';
const sel=Array(Q).fill(null),sub=Array(Q).fill(false),ok=Array(Q).fill(false);
const seen=Array(N_+1).fill(false);   // seen[n]: card n has been opened (not just passed while dragging the strip)
const nCorrect=()=>ok.filter(Boolean).length,allCorrect=()=>nCorrect()===Q;
function nextTarget(from){for(let k=from+1;k<Q;k++)if(!ok[k])return k;for(let k=0;k<=from;k++)if(!ok[k])return k;return -1;}
const inStage=g=>CARDS.filter(c=>c.g===g).length, before=(i)=>CARDS.slice(0,i).filter(c=>c.g===CARDS[i].g).length;
const QUIZ_LEG=LEGS.length-1, units=g=>g===QUIZ_LEG?inStage(g)+1:inStage(g);   // the quiz leg: its card(s) plus room for the quiz
/* one dot per card, spaced evenly inside its stage; dot k of n sits at k/n of the stage width */
routeEl.style.gridTemplateColumns=LEGS.map((l,g)=>`minmax(44px,${units(g)}fr)`).join(' ');
routeEl.innerHTML=LEGS.map((l,g)=>`<div class="leg"><div class="rail"><i class="fill"></i>${CARDS.map((c,i)=>c.g!==g?'':
  `<button class="dot" type="button" data-n="${i+1}" style="left:calc(7px + ${100*before(i)/units(g)}%)" aria-label="Card ${i+1}: ${c.t}"></button>`).join('')}</div><span aria-hidden="true">${l}</span></div>`).join('');
const DOTS=[...routeEl.querySelectorAll('.dot')];

function progress(){
  let leg=-1,frac=0,label;
  if(step===0){label='About 7 minutes';}
  else if(step<=N_){const c=CARDS[step-1];leg=c.g;frac=before(step-1)/units(c.g);label=`Card ${step} of ${N_}`;}
  else if(step===N_+1){leg=QUIZ_LEG;frac=nCorrect()/Q;label=`Quiz · ${nCorrect()} of ${Q} correct`;}
  else{leg=QUIZ_LEG;frac=1;label='Finished';}
  document.getElementById('count').textContent=label;
  [...routeEl.children].forEach((el,i)=>{el.classList.toggle('done',i<leg);el.classList.toggle('now',i===leg);
    const f=i<leg?1:i===leg?frac:0;
    // the quiz leg fills from its card dot to the end of the bar, by correct answers
    el.querySelector('.fill').style.width=i===QUIZ_LEG&&step>N_?`calc((100% - 14px) * ${f})`:`calc(100% * ${f})`;});
  DOTS.forEach(d=>{const n=+d.dataset.n;d.classList.toggle('now',n===step);d.classList.toggle('seen',seen[n]&&n!==step);
    if(n===step)d.setAttribute('aria-current','step');else d.removeAttribute('aria-current');});
  backBtn.hidden=step===0;
}
function paint(html){view.innerHTML=DEFS+html;progress();const f=view.querySelector('[data-focus]');if(f)f.focus({preventScroll:true});}
backBtn.onclick=()=>{if(step<=N_)step--;else if(step===N_+1){if(qi>0)qi--;else step=N_;}else if(step===N_+2){step=N_+1;qi=Q-1;}else step=N_+2;render();};

const startHTML=()=>`<section class="card"><div class="scene">${S.job}</div><h1>Dash Cam Drive Guide</h1>
    <p class="lead">The rules for every dash cam survey drive. Read ${N_} short cards, then answer ${Q} quick questions.</p>
    <div class="eyebrow">The four things that matter most</div>${keyList(true)}
    <p class="note">Your supervisor gives you the details for your job. If your supervisor tells you something different, follow your supervisor.</p></section>
  <div class="nav"><button class="primary" id="go" data-focus>Start</button></div>`;
function renderStart(){
  paint(startHTML());
  document.getElementById('go').onclick=()=>{step=1;render();};
}
const PLUG_L={power:['Step 1: plug the cameras into the adapter','Step 2: plug the adapter into the car','Unplug the adapter from the car'],
  between:[null,'Next session soon: plug the adapter in again','Session finished: pull the adapter out']};
function cardHTML(n){          // n = card number, 1..N_. Also used for the neighbour page while swiping.
  const c=CARDS[n-1],last=n===N_,s0=c.plug==='power'?0:2;
  const nextLabel=!last?'Next':allCorrect()?'Back to the finish':quizStarted?'Back to the quiz':'Start the quiz';
  const plugUI=c.plug?`<ol class="steps" aria-hidden="true">${c.plug==='power'?'<li id="st1">1 · Cameras → adapter</li><li id="st2">2 · Adapter → car</li>':'<li id="st1" class="done">Recording</li><li id="st2">Stopped</li>'}</ol><button class="tap" id="plugBtn" type="button">${PLUG_L[c.plug][s0]}</button>`:'';
  const chooseUI=c.choose?'<div class="seg" role="group" aria-label="Choose your start point"><span>Where do you start?</span><button type="button" data-s="A" aria-pressed="true">A</button><button type="button" data-s="B" aria-pressed="false">B</button></div>':'';
  return `<section class="card"><div class="stage">${c.g+1} · ${STAGES[c.g]}</div><h1 tabindex="-1" data-focus>${c.t}</h1>
    <div class="scene" id="sc" ${c.plug?`data-s="${s0}"`:''} ${c.choose?'data-start="A"':''}>${c.s}</div>${plugUI}${chooseUI}
    ${c.lead?`<p class="lead">${c.lead}</p>`:''}${c.keys?keyList(false):`<ul class="pts">${c.pts.map(p=>`<li>${p}</li>`).join('')}</ul>`}</section>
  <div class="nav"><button class="primary" id="next">${nextLabel}</button></div>`;
}
function renderCard(){
  const c=CARDS[step-1];
  paint(cardHTML(step));
  const sc=document.getElementById('sc');
  if(c.plug){
    const b=document.getElementById('plugBtn'),s1=document.getElementById('st1'),s2=document.getElementById('st2');
    const L=PLUG_L[c.plug];
    const set=v=>{sc.dataset.s=v;b.textContent=L[v];
      if(c.plug==='power'){s1.classList.toggle('done',v>=1);s2.classList.toggle('done',v>=2);}else{s1.classList.toggle('done',v===2);s2.classList.toggle('done',v===1);}};
    const nx=()=>{const v=+sc.dataset.s;set(v===0?1:v===1?2:1);};
    b.onclick=nx;sc.querySelector('svg').addEventListener('click',nx);set(+sc.dataset.s);
  }
  if(c.choose) view.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{sc.dataset.start=b.dataset.s;view.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  document.getElementById('next').onclick=()=>{step++;if(step===N_+1){quizStarted=true;if(allCorrect())step=name?N_+3:N_+2;}render();};
}
function renderQuiz(){
  const q=QUIZ[qi];
  paint(`<section class="card"><div class="qhead"><div class="stage">Question ${qi+1} of ${Q}</div><button class="reset" id="reset" type="button">Reset</button></div>
    <h1 class="q" tabindex="-1" data-focus>${q.q}</h1><div class="scene">${QS[qi]}</div>
    <p class="note" id="howto">Tap an answer, then tap Check answer.</p>
    <div class="opts" role="radiogroup" aria-labelledby="howto">${q.o.map((t,k)=>`<button class="opt" type="button" role="radio" data-k="${k}">${t}</button>`).join('')}</div><div id="fb"></div></section>
  <div class="nav"><button class="primary" id="next" type="button"></button></div>`);
  const nx=document.getElementById('next'),rs=document.getElementById('reset'),fb=document.getElementById('fb');
  function update(){
    view.querySelectorAll('.opt').forEach(x=>{const k=+x.dataset.k;x.classList.toggle('sel',sel[qi]===k&&!sub[qi]);x.classList.toggle('right',sub[qi]&&k===q.a);x.classList.toggle('wrong',sub[qi]&&k===sel[qi]&&k!==q.a);x.setAttribute('aria-checked',sel[qi]===k);x.disabled=sub[qi];});
    fb.innerHTML=!sub[qi]?'':ok[qi]?`<p class="fb ok"><b>Right.</b>${q.why}</p>`:`<p class="fb bad"><b>Not quite.</b>${q.why} Tap Reset to try again now, or go on and answer it again at the end.</p>`;
    if(!sub[qi]){nx.textContent='Check answer';nx.disabled=sel[qi]===null;}else{nx.disabled=false;nx.textContent=nextTarget(qi)===-1?'Finish':'Next question';}
    rs.hidden=sel[qi]===null&&!sub[qi];rs.classList.toggle('alert',sub[qi]&&!ok[qi]);progress();
  }
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(sub[qi])return;sel[qi]=+b.dataset.k;update();});
  nx.onclick=()=>{if(!sub[qi]){if(sel[qi]===null)return;sub[qi]=true;ok[qi]=sel[qi]===q.a;update();nx.focus();return;}
    const t=nextTarget(qi);if(t===-1){step=N_+2;render();return;}qi=t;if(sub[qi]&&!ok[qi]){sub[qi]=false;sel[qi]=null;}render();};
  rs.onclick=()=>{sel[qi]=null;sub[qi]=false;ok[qi]=false;update();};
  update();
}
function renderName(){
  paint(`<section class="card"><div class="stage">All ${Q} questions right</div><h1>Well done</h1><p class="lead">Type your full name to finish.</p>
    <form id="nf" style="display:flex;flex-direction:column;gap:8px"><label for="nm">Your full name</label><input type="text" id="nm" autocomplete="name" required data-focus>
    <button class="primary" type="submit">I have read and understood the rules</button></form></section>`);
  document.getElementById('nm').value=name;
  document.getElementById('nf').addEventListener('submit',e=>{e.preventDefault();const v=document.getElementById('nm').value.trim();if(!v)return;name=v;step=N_+3;render();});
}
function renderDone(){
  const when=new Date().toLocaleString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
  paint(`<section class="card"><div class="cert"><svg viewBox="0 0 56 56" aria-hidden="true">${C(28,28,26,SG)}<path d="M16 29 L25 38 L41 20" fill="none" stroke="${W}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="eyebrow">Dash Cam Drive Guide · completed</div><div class="who" id="who" tabindex="-1" data-focus></div>
    <div>has read the rules and answered all ${Q} questions correctly.</div><div class="when">${when}</div></div>
    <p class="lead"><strong>Take a screenshot of this card and send it to your supervisor.</strong></p><p class="note">This page does not send anything by itself.</p></section>`);
  document.getElementById('who').textContent=name;
}
let shown=-1;
function render(quiet,keep){   // keep = stay at the same scroll height (after a swipe)
  const was=shown; shown=step; view.classList.remove('inR','inL');
  if(step>=1&&step<=N_&&!(rs&&rs.scrub))seen[step]=true;   // cards only passed while dragging the strip are not marked
  if(step===0)renderStart();else if(step<=N_)renderCard();else if(step===N_+1)renderQuiz();else if(step===N_+2)renderName();else renderDone();
  if(!keep)window.scrollTo({top:0});
  // slide in from the side the page came from. Start page and cards only: the quiz stays still.
  if(!quiet&&was>=0&&was!==step&&was<=N_&&step<=N_){void view.offsetWidth;view.classList.add(step>was?'inR':'inL');}
  stopPageHint();
  if(TOUCH&&!pageHintDone&&step<=N_)pageHint();   // start page or a card, whichever opens first
}

/* ---------- swipe the page left / right to change card (touch only; up / down still scrolls).
   The page moves with the finger and the next / previous page comes in beside it.
   Works on the start page and the cards. Not in the quiz, the name page or the finish page. ---------- */
const peek=document.getElementById('peek'),pager=document.getElementById('pager'),PGAP=16;
const pageHTML=n=>DEFS+(n===0?startHTML():cardHTML(n));
let sw=null;
function swMove(dx,anim){
  const tr=anim?'transform .22s ease-out':'none';
  view.style.transition=tr;peek.style.transition=tr;
  view.style.transform=dx?`translateX(${dx}px)`:'';
  if(!peek.hidden)peek.style.transform=`translateX(${dx+(sw.dir<0?1:-1)*(view.offsetWidth+PGAP)}px)`;
}
function swPeek(dir){                    // dir -1 = finger moves left = next page
  const to=dir<0?(step<N_?step+1:null):(step>0?step-1:null);   // last card: no swipe into the quiz, use the button
  sw.dir=dir;sw.to=to;
  if(to===null){peek.hidden=true;peek.innerHTML='';return;}
  peek.innerHTML=pageHTML(to);peek.hidden=false;
  // The neighbour sits at the same height as the current page, so nothing jumps when the swipe ends.
}
function swEnd(done){
  const s=sw;sw=null;
  const finish=()=>{view.style.transition=peek.style.transition='none';view.style.transform='';peek.hidden=true;peek.innerHTML='';peek.style.transform='';};
  if(!s||!s.drag){finish();return;}
  sw=s;                                  // swMove reads sw.dir
  if(done&&s.to!==null){
    swMove((s.dir<0?-1:1)*(view.offsetWidth+PGAP),true);sw=null;
    setTimeout(()=>{finish();if(step===s.from){const y=window.scrollY;step=s.to;render(true,true);window.scrollTo(0,y);}},230);   // a button may have changed the page meanwhile
  }else{swMove(0,true);sw=null;setTimeout(finish,230);}
}
document.getElementById('pager').addEventListener('touchstart',e=>{
  if(sw&&sw.drag)return;
  sw=(step<=N_&&e.touches.length===1)?{x:e.touches[0].clientX,y:e.touches[0].clientY,lx:e.touches[0].clientX,lt:Date.now(),v:0,drag:false,dir:0,to:null,from:step}:null;
},{passive:true});
document.getElementById('pager').addEventListener('touchmove',e=>{
  if(!sw||e.touches.length!==1)return;
  const p=e.touches[0],dx=p.clientX-sw.x,dy=p.clientY-sw.y,now=Date.now();
  if(!sw.drag){                          // decide once: sideways swipe, or normal up / down scroll
    if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
    if(Math.abs(dx)<Math.abs(dy)*1.3){sw=null;return;}
    sw.drag=true;view.classList.remove('inR','inL');swPeek(dx<0?-1:1);
  }
  if((dx<0?-1:1)!==sw.dir&&dx!==0)swPeek(dx<0?-1:1);   // finger went back past the start: show the other neighbour
  if(now>sw.lt){sw.v=(p.clientX-sw.lx)/(now-sw.lt);sw.lx=p.clientX;sw.lt=now;}
  swMove(sw.to!==null?dx:dx*.25,false);  // no page that way: the page resists
  sw.dx=dx;
},{passive:true});
document.getElementById('pager').addEventListener('touchend',()=>{
  if(!sw||!sw.drag){sw=null;return;}
  const dx=sw.dx||0,far=Math.abs(dx)>view.offsetWidth*.3,flick=Math.abs(sw.v)>.45&&Math.abs(dx)>30&&(sw.v<0)===(dx<0);
  swEnd(far||flick);
},{passive:true});
document.getElementById('pager').addEventListener('touchcancel',()=>swEnd(false),{passive:true});

/* ---------- card dots in the progress bar: tap a dot, or drag along the strip, to open any card.
   The dots are small, so the whole strip is the touch area: the dot nearest the finger is used.
   Taps and the end of a drag open the card at its top. While dragging, the card changes as the finger passes each dot.
   The quiz part of the bar has no dots: a touch there (further than HIT px from the last card dot) does nothing.
   From the quiz, the name page or the finish page a dot still opens a card; quiz answers are kept,
   and the last card's button leads back. ---------- */
const HIT=16;
let rs=null;
function nearestDot(x){let best=null,bd=HIT;DOTS.forEach(d=>{const r=d.getBoundingClientRect(),dd=Math.abs(x-(r.left+r.width/2));if(dd<bd){bd=dd;best=+d.dataset.n;}});return best;}
function openCard(n,quiet){if(n===null||n===step)return;if(sw)swEnd(false);step=n;render(quiet);}
routeEl.addEventListener('pointerdown',e=>{
  if(sw&&sw.hint)stopPageHint();         // pointer events come before the touchstart that stops the hint
  if((sw&&sw.drag)||(e.pointerType==='mouse'&&e.button!==0)){rs=null;return;}
  rs={id:e.pointerId,x:e.clientX,y:e.clientY,scrub:false};
});
routeEl.addEventListener('pointermove',e=>{
  if(!rs||e.pointerId!==rs.id)return;
  const dx=e.clientX-rs.x,dy=e.clientY-rs.y;
  if(!rs.scrub){
    if(Math.abs(dx)<8)return;
    if(Math.abs(dx)<Math.abs(dy)){rs=null;return;}      // an up / down move: leave it to the page scroll
    rs.scrub=true;try{routeEl.setPointerCapture(e.pointerId);}catch(_){}
  }
  openCard(nearestDot(e.clientX),true);
});
routeEl.addEventListener('pointerup',e=>{
  if(!rs||e.pointerId!==rs.id)return;
  const s=rs;rs=null;
  if(s.scrub){if(step>=1&&step<=N_){seen[step]=true;progress();}}
  else openCard(nearestDot(e.clientX),false);
});
routeEl.addEventListener('pointercancel',()=>{rs=null;if(step>=1&&step<=N_){seen[step]=true;progress();}});
// keyboard: Tab to a dot, Enter or Space. (Pointer clicks are handled above; e.detail is 0 only for keyboard clicks.)
DOTS.forEach(d=>d.addEventListener('click',e=>{if(e.detail===0)openCard(+d.dataset.n,false);}));

/* ---------- page swipe hint: touch screens only, the first swipeable page opened in a visit (normally the start page).
   A hand drags the page sideways, the next card comes in beside it, then the page springs back. Any touch stops it. ---------- */
const TOUCH=matchMedia('(pointer: coarse)').matches;
let pageHintDone=false,phT=0,phRaf=0;
const PH=document.createElement('div');PH.className='phint';PH.setAttribute('aria-hidden','true');
PH.innerHTML='<span class="phcap">Swipe to change card</span><span class="phand"><svg viewBox="-22 -4 58 64"><g transform="rotate(-16 16 58)"><path class="co" d="M16 0 C25 0 30 7 30 16 L30.5 32 C31 38 30 46 29 60 L5 60 C3.5 46 2 38 2.4 32 L2 16 C2 7 7 0 16 0Z"/><path class="cf" d="M16 2.2 C23.6 2.2 27.8 8 27.8 16 L28.3 32 C28.7 38 27.8 46 26.8 60 L7.2 60 C6 46 4.4 38 4.6 32 L4.2 16 C4.2 8 8.4 2.2 16 2.2Z"/><path class="cn" d="M16 5.5 C21.5 5.5 23.6 9 23.6 13.5 L23.4 19 C23.3 21 21.6 22.2 19.6 22.2 L12.4 22.2 C10.4 22.2 8.7 21 8.6 19 L8.4 13.5 C8.4 9 10.5 5.5 16 5.5Z"/><path class="cl" d="M9 34.2 Q16 31.6 23.6 34.2 L23.6 35.8 Q16 33.4 9 35.8Z"/></g></svg></span>';
document.body.appendChild(PH);
function stopPageHint(){
  clearTimeout(phT);cancelAnimationFrame(phRaf);phT=phRaf=0;PH.classList.remove('on','press');PH.style.opacity='';
  if(sw&&sw.hint){sw=null;view.style.transition=peek.style.transition='none';view.style.transform='';peek.hidden=true;peek.innerHTML='';peek.style.transform='';}
}
function pageHint(){
  pageHintDone=true;
  phT=setTimeout(()=>{
    phT=0;
    const dir=step<N_?-1:1;
    sw={drag:true,hint:true,dir:0,to:null,from:step};swPeek(dir);if(sw.to===null){stopPageHint();return;}
    const W=view.offsetWidth,D=dir*Math.min(W*.42,170),x0=innerWidth*(dir<0?.7:.3),y=innerHeight*.58;
    const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, seg=(p,a,b)=>p<=a?0:p>=b?1:ease((p-a)/(b-a));
    const DUR=2800;let t0=0;
    PH.classList.add('on');
    const frame=now=>{
      if(!t0)t0=now;
      const p=(now-t0)/DUR;
      if(p>=1){stopPageHint();return;}
      const dx=D*(seg(p,.2,.6)-seg(p,.72,.92));                     // drag, hold, spring back
      PH.classList.toggle('press',p>.14&&p<.7);
      PH.style.opacity=p<.1?p/.1:p>.9?(1-p)/.1:1;
      PH.style.transform=`translate(${x0+dx}px,${y}px)`;
      swMove(dx,false);
      phRaf=requestAnimationFrame(frame);
    };
    phRaf=requestAnimationFrame(frame);
  },700);
}
window.addEventListener('touchstart',()=>{if(phT||phRaf)stopPageHint();},{capture:true,passive:true});

render();
})();
</script>

</body>
</html>
