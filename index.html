<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rules and a short quiz for dash cam road survey drivers.">
<title>Dash Cam Drive Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&family=Overpass+Mono:wght@600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column, one card at a time; Back top-left, a road strip shows progress; each card opens with an animated clip-art scene. */
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --ink:#1B2220; --muted:#56625D; --line:#D2D8D3;
  --sign:#0D6A46; --sign-ink:#FFFFFF; --lane:#E9AE00; --asphalt:#2A322F;
  --ok:#1C7A4B; --ok-bg:#E3F3EA; --bad:#B42318; --bad-bg:#FBE9E7; --scene-dim:1;
  --f-display:"Overpass", "Arial Narrow", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"Overpass Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141917; --surface:#1E2523; --ink:#E8EDEA; --muted:#9CA8A3; --line:#33403B;
  --sign:#2C9A6B; --sign-ink:#08130E; --lane:#F2C230; --asphalt:#0C100F;
  --ok:#4CC38A; --ok-bg:#17332A; --bad:#FF7A6E; --bad-bg:#3A1E1B; --scene-dim:.86; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1E2523; --ink:#E8EDEA; --muted:#9CA8A3; --line:#33403B;
  --sign:#2C9A6B; --sign-ink:#08130E; --lane:#F2C230; --asphalt:#0C100F;
  --ok:#4CC38A; --ok-bg:#17332A; --bad:#FF7A6E; --bad-bg:#3A1E1B; --scene-dim:.86; color-scheme:dark }

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 32px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:12px;min-height:44px}
.back{font-family:var(--f-display);font-weight:800;font-size:16px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:8px 16px 6px;cursor:pointer;display:flex;align-items:center;gap:6px}
.back svg{width:14px;height:14px}
.back[hidden]{display:none}
.brand{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.brand span{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.road{position:relative;height:22px;border-radius:6px;background:var(--asphalt);overflow:hidden}
.road::before{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;margin-top:-1px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 10px,transparent 10px 20px)}
.road .done{position:absolute;left:8px;top:50%;height:4px;margin-top:-2px;background:var(--lane);border-radius:2px;width:0;transition:width .35s ease}
.road .car{position:absolute;top:3px;width:26px;height:16px;transition:left .35s ease}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sign{align-self:flex-start;margin:0;background:var(--sign);color:var(--sign-ink);font-family:var(--f-display);font-weight:800;
  font-size:26px;line-height:1.15;padding:10px 16px 8px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--sign),inset 0 0 0 4px var(--sign-ink);text-wrap:balance;max-width:100%}
.sign:focus{outline:none}
.lead{margin:0;font-size:18px}
ul.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.pts li{position:relative;padding-left:26px}
ul.pts li::before{content:"";position:absolute;left:4px;top:.55em;width:12px;height:4px;background:var(--lane);border-radius:2px}
.note{font-size:15px;color:var(--muted);margin:0}
.no{color:var(--bad);font-weight:700}

.scene{border-radius:12px;overflow:hidden;border:2px solid var(--ink);background:#D7ECF4;filter:brightness(var(--scene-dim));position:relative}
.scene svg{display:block;width:100%;height:auto}
.scene .hint{position:absolute;left:10px;top:10px}
.tap{font-family:var(--f-display);font-weight:800;font-size:15px;background:#FFFFFF;color:#1B2220;border:2px solid #1B2220;border-radius:999px;padding:7px 14px 5px;cursor:pointer;box-shadow:0 3px 0 #1B2220}
.tap:active{transform:translateY(2px);box-shadow:0 1px 0 #1B2220}

.nav{display:flex;gap:12px}
button{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.primary{flex:1;font-family:var(--f-display);font-weight:800;font-size:17px;border-radius:10px;padding:13px 20px 11px;cursor:pointer;border:2px solid transparent;background:var(--sign);color:var(--sign-ink)}
.ghost{font-family:var(--f-display);font-weight:800;font-size:16px;border-radius:10px;padding:12px 18px 10px;cursor:pointer;background:transparent;color:var(--ink);border:2px solid var(--line)}
.primary:disabled{opacity:.45;cursor:default}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;cursor:pointer;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:14px 16px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--sign)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.sel{border-color:var(--sign);box-shadow:inset 0 0 0 2px var(--sign);font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ghost.small{padding:6px 14px 4px;font-size:14px;border-radius:999px}
.ghost.small.alert{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.fb{border-radius:10px;padding:12px 14px;margin:0}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb b{display:block;font-family:var(--f-display)}

label{font-weight:700}
input[type=text]{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.cert{border:3px solid var(--sign);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;text-align:center}
.cert .tick{width:56px;height:56px;margin:0 auto}
.cert .who{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.2;overflow-wrap:anywhere}
.cert .when{font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.keys li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.keys li > div{min-width:0}
.keys svg{width:34px;height:34px}
.keys b{display:block;font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.25}
.keys span{display:block;color:var(--muted);font-size:15px}
.chip{font-family:var(--f-mono);font-size:14px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--muted)}

/* ---------- scene motion ---------- */
.fb-box{transform-box:fill-box;transform-origin:center}
@keyframes lane{to{stroke-dashoffset:80}}
.lane-move{animation:lane .9s linear infinite}
.lane-slow{animation:lane 2.4s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.33px)}}
.bob{animation:bob .5s ease-in-out infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.55}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pop{0%,10%{transform:scale(0);opacity:0}22%{transform:scale(1.12);opacity:1}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.pop{transform-box:fill-box;transform-origin:left bottom;animation:pop 3.2s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-box:view-box;animation:spin 4s linear infinite}
@keyframes drop{0%{transform:translateY(-40px);opacity:0}60%{transform:translateY(4px);opacity:1}100%{transform:translateY(0)}}
.drop{animation:drop .8s cubic-bezier(.3,1.4,.5,1) both}
.drop2{animation-delay:.25s}
@keyframes tickin{0%,40%{transform:scale(0)}55%{transform:scale(1.15)}65%,100%{transform:scale(1)}}
.tickin{transform-box:fill-box;transform-origin:center;animation:tickin 1.2s ease-out both}
.t2{animation-delay:.35s}
@keyframes roll{0%{transform:translateY(0)}100%{transform:translateY(-270px)}}
.roll{animation:roll 9s steps(9) infinite}
@keyframes flash{0%,78%,100%{opacity:0}82%{opacity:.9}}
.flash{animation:flash 2.6s linear infinite}
@keyframes needle{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
.needle{transform-box:view-box;animation:needle 2.8s ease-in-out infinite}
@keyframes jam{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.jam{animation:jam 2.2s ease-in-out infinite}
@keyframes trip{0%{transform:translateX(0) scaleX(1)}34%{transform:translateX(220px) scaleX(1)}36%{transform:translateX(220px) scaleX(-1)}64%{transform:translateX(0) scaleX(-1)}66%,100%{transform:translateX(0) scaleX(1)}}
.trip{transform-box:fill-box;transform-origin:center;animation:trip 8s ease-in-out infinite}
@keyframes tripB{0%{transform:translateX(220px) scaleX(-1)}34%{transform:translateX(0) scaleX(-1)}36%{transform:translateX(0) scaleX(1)}64%,100%{transform:translateX(220px) scaleX(1)}}
[data-start="B"] .trip{animation-name:tripB}
[data-start="A"] .forB,[data-start="B"] .forA{display:none}
.seg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700}
.seg .tap{min-width:56px}
.seg .tap[aria-pressed="true"]{background:#0D6A46;color:#FFFFFF}
@keyframes timesup{0%,16%{opacity:0;transform:translateY(6px)}20%,40%{opacity:1;transform:translateY(0)}44%,100%{opacity:0}}
.timesup{animation:timesup 8s ease-out infinite}
@keyframes finish{0%,64%{opacity:0;transform:scale(.6)}70%,96%{opacity:1;transform:scale(1)}100%{opacity:0}}
.finish{transform-box:fill-box;transform-origin:center bottom;animation:finish 8s ease-out infinite}
@keyframes wave{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.wave{transform-box:fill-box;transform-origin:left center;animation:wave 1.4s ease-out infinite}
.w2{animation-delay:.45s}
@keyframes unplug{0%,35%{transform:translateX(0)}50%,85%{transform:translateX(-26px)}100%{transform:translateX(0)}}
.unplug{animation:unplug 4s ease-in-out infinite}
@keyframes recoff{0%,45%{opacity:1}50%,88%{opacity:0}93%,100%{opacity:1}}
.recoff{animation:recoff 4s linear infinite}
@keyframes offon{0%,45%{opacity:0}50%,88%{opacity:1}93%,100%{opacity:0}}
.offon{animation:offon 4s linear infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.nudge{animation:nudge 1.2s ease-in-out infinite}
@keyframes shake{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-8deg)}88%{transform:rotate(8deg)}92%{transform:rotate(-5deg)}96%{transform:rotate(4deg)}}
.shake{transform-box:fill-box;transform-origin:center;animation:shake 2.4s ease-in-out infinite}
/* interactive power scene */
.plug{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
[data-on="1"] .plug{transform:translateX(-34px)}
.scr-on{opacity:0;transition:opacity .3s .35s}
[data-on="1"] .scr-on{opacity:1}
[data-on="1"] .scr-off{opacity:0}
.scr-off{transition:opacity .2s .3s}
.glow{opacity:0;transition:opacity .3s .3s}
[data-on="1"] .glow{opacity:1}

/* Reduce Motion on: scenes start still; the viewer can tap Play to run one scene's animation. */
html.rm .road .done,html.rm .road .car{transition:none}
html.rm .scene:not(.playing) :is(.lane-move,.lane-slow,.bob,.blink,.pulse,.pop,.spin,.drop,.tickin,.roll,.flash,.needle,.jam,.trip,.timesup,.finish,.wave,.unplug,.recoff,.offon,.nudge,.shake){animation:none!important}
html.rm .scene:not(.playing) :is(.pop,.timesup,.finish,.wave){opacity:1}
html.rm .scene:not(.playing) .offon{opacity:0}
.playbtn{position:absolute;right:10px;top:10px}
html:not(.rm) .playbtn{display:none}
</style>
</head>
<body>
<!-- shared clip-art parts -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="car" viewBox="0 0 122 62">
      <!-- side view, front of the car on the RIGHT: long bonnet at front, short boot at back -->
      <path d="M6 46 L6 35 Q6 29 12 28 L20 27 L32 11 Q34 9 38 9 L64 9 Q68 9 71 12 L86 27 L106 29 Q116 30 116 39 L116 46 Q116 50 112 50 L10 50 Q6 50 6 46 Z" fill="#E8553E" stroke="#1B2220" stroke-width="3" stroke-linejoin="round"/>
      <path d="M36 14 L26 27 L47 27 L47 14 Z" fill="#CFE6F0" stroke="#1B2220" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M52 14 L52 27 L81 27 L69 15 Q68 14 66 14 Z" fill="#CFE6F0" stroke="#1B2220" stroke-width="2.5" stroke-linejoin="round"/>

      <rect x="57" y="15.5" width="5" height="4" rx="1" fill="#1B2220"/><rect x="63" y="15.5" width="5" height="4" rx="1" fill="#1B2220"/>
      <rect x="109" y="33" width="7" height="5" rx="1.5" fill="#F6D365" stroke="#1B2220" stroke-width="1.5"/>

      <line x1="38" y1="32" x2="44" y2="32" stroke="#1B2220" stroke-width="2.5" stroke-linecap="round"/><line x1="56" y1="32" x2="62" y2="32" stroke="#1B2220" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="30" cy="50" r="10" fill="#1B2220"/><circle cx="30" cy="50" r="4" fill="#C9D2CE"/>
      <circle cx="94" cy="50" r="10" fill="#1B2220"/><circle cx="94" cy="50" r="4" fill="#C9D2CE"/>

    <symbol id="car2" viewBox="0 0 122 62">
      <path d="M6 46 L6 35 Q6 29 12 28 L20 27 L32 11 Q34 9 38 9 L64 9 Q68 9 71 12 L86 27 L106 29 Q116 30 116 39 L116 46 Q116 50 112 50 L10 50 Q6 50 6 46 Z" fill="#4A90C8" stroke="#1B2220" stroke-width="3" stroke-linejoin="round"/>
      <path d="M36 14 L26 27 L47 27 L47 14 Z" fill="#CFE6F0" stroke="#1B2220" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M52 14 L52 27 L81 27 L69 15 Q68 14 66 14 Z" fill="#CFE6F0" stroke="#1B2220" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="49.5" y1="12" x2="49.5" y2="48" stroke="#1B2220" stroke-width="2"/>
      <rect x="109" y="33" width="7" height="5" rx="1.5" fill="#F6D365" stroke="#1B2220" stroke-width="1.5"/>
      <rect x="6" y="32" width="5" height="6" rx="1.5" fill="#E5333B" stroke="#1B2220" stroke-width="1.5"/>
      <line x1="38" y1="32" x2="44" y2="32" stroke="#1B2220" stroke-width="2.5" stroke-linecap="round"/><line x1="56" y1="32" x2="62" y2="32" stroke="#1B2220" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="30" cy="50" r="10" fill="#1B2220"/><circle cx="30" cy="50" r="4" fill="#C9D2CE"/>
      <circle cx="94" cy="50" r="10" fill="#1B2220"/><circle cx="94" cy="50" r="4" fill="#C9D2CE"/>
    </symbol>
    <symbol id="cam" viewBox="0 0 40 26">
      <rect x="2" y="2" width="36" height="22" rx="6" fill="#2A322F" stroke="#1B2220" stroke-width="2.5"/>
      <circle cx="20" cy="13" r="7" fill="#5C6A66" stroke="#1B2220" stroke-width="2"/><circle cx="20" cy="13" r="3" fill="#9FD3E6"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <header class="top">
    <div class="bar">
      <button class="back" id="backBtn" hidden aria-label="Go back one page"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 L4 7 L9 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button>
      <div class="brand"><b>Dash Cam Drive Guide</b><span id="count"></span></div>
    </div>
    <div class="road" aria-hidden="true">
      <div class="done" id="done"></div>
      <svg class="car" id="pcar" viewBox="0 0 26 16"><rect x="1" y="3" width="22" height="10" rx="4" fill="#F2F2F2"/><rect x="15" y="5" width="5" height="6" rx="1.5" fill="#2A322F"/><rect x="23" y="5" width="2" height="2" fill="#F2C230"/><rect x="23" y="9" width="2" height="2" fill="#F2C230"/></svg>
    </div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<script>
(function(){
const T = (x,y,s,txt,o={}) => `<text x="${x}" y="${y}" font-family="${o.mono?'Overpass Mono, monospace':'Overpass, Arial, sans-serif'}" font-weight="800" font-size="${s}" fill="${o.fill||'#1B2220'}" text-anchor="${o.a||'middle'}">${txt}</text>`;
const SKY = `<rect width="340" height="200" fill="#D7ECF4"/>`;
const ROAD = (y=140) => `<rect y="${y}" width="340" height="${200-y}" fill="#3A4240"/><rect y="${y}" width="340" height="5" fill="#59625F"/>`;
const LANE = (y, cls='lane-move') => `<line x1="-40" y1="${y}" x2="380" y2="${y}" stroke="#F2C230" stroke-width="5" stroke-dasharray="26 14" class="${cls}"/>`;
const BADGE = (x,y,w,txt,fill='#0D6A46') => `<g><rect x="${x}" y="${y}" width="${w}" height="26" rx="13" fill="${fill}" stroke="#1B2220" stroke-width="2.5"/>${T(x+w/2,y+18,13,txt,{fill:'#FFFFFF'})}</g>`;
const NO = (cx,cy,r) => `<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E5333B" stroke-width="6"/><line x1="${cx-r*.7}" y1="${cy-r*.7}" x2="${cx+r*.7}" y2="${cy+r*.7}" stroke="#E5333B" stroke-width="6"/></g>`;

const S = {};
S.job = `<svg viewBox="0 0 340 200" role="img" aria-label="A car driving with two dash cams recording the road">${SKY}
  <circle cx="292" cy="40" r="18" fill="#F6D365" stroke="#1B2220" stroke-width="2.5"/>
  <rect x="18" y="74" width="34" height="68" fill="#B8D3DE"/><rect x="58" y="92" width="28" height="50" fill="#A9C7D4"/><rect x="250" y="84" width="40" height="58" fill="#B8D3DE"/>
  ${ROAD(140)}${LANE(172)}
  <polygon points="214,134 340,106 340,172" fill="#FFFFFF" class="pulse"/>
  <g class="bob"><use href="#car" x="92" y="110" width="126" height="64"/></g>
  <g><rect x="16" y="16" width="80" height="30" rx="8" fill="#1B2220"/><circle cx="34" cy="31" r="7" fill="#E5333B" class="blink"/>${T(66,37,15,'REC',{fill:'#FFFFFF',mono:1})}</g>
</svg>`;
S.before = `<svg viewBox="0 0 340 200" role="img" aria-label="A phone message saying I'm coming, a fuel pump, a toilet sign and a clock">${SKY}
  <rect y="168" width="340" height="32" fill="#9CC5A6"/>
  <rect x="26" y="18" width="96" height="164" rx="16" fill="#1B2220"/><rect x="34" y="32" width="80" height="134" rx="8" fill="#FFFFFF"/>
  <rect x="62" y="22" width="24" height="5" rx="2.5" fill="#56625D"/>
  <g class="pop"><rect x="42" y="74" width="66" height="44" rx="12" fill="#2C9A6B" stroke="#1B2220" stroke-width="2"/>${T(75,92,11,"I'm coming",{fill:'#FFFFFF'})}<path d="M64 103 L71 110 L86 97" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <rect x="44" y="132" width="60" height="18" rx="9" fill="#E6ECE9"/>
  <g><rect x="150" y="70" width="48" height="98" rx="8" fill="#E8553E" stroke="#1B2220" stroke-width="3"/><rect x="158" y="80" width="32" height="22" rx="3" fill="#FFFFFF" stroke="#1B2220" stroke-width="2"/>

S.keys = `<svg viewBox="0 0 340 200" role="img" aria-label="Four key points: stay safe, on time, recording, stay on route">
  <rect width="340" height="200" fill="#D7ECF4"/>
  ${[8,91,174,257].map(x=>`<rect x="${x}" y="22" width="75" height="140" rx="12" fill="#FFFFFF" stroke="#1B2220" stroke-width="3"/>`).join('')}
  <g class="tickin"><path d="M45.5 44 L64 52 L64 66 Q64 82 45.5 90 Q27 82 27 66 L27 52 Z" fill="#0D6A46" stroke="#1B2220" stroke-width="3"/><path d="M37 67 L44 74 L55 61" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="tickin" style="animation-delay:.25s"><circle cx="128.5" cy="67" r="22" fill="#FFFFFF" stroke="#1B2220" stroke-width="3"/>

  <g class="tickin" style="animation-delay:.5s"><rect x="186" y="50" width="50" height="34" rx="6" fill="#1B2220"/><circle cx="199" cy="67" r="6" fill="#E5333B" class="blink"/>${T(220,72,11,'REC',{fill:'#FFFFFF',mono:1})}</g>
  <g class="tickin" style="animation-delay:.75s"><rect x="272" y="45" width="44" height="44" rx="7" fill="#0D6A46" stroke="#1B2220" stroke-width="3"/><path d="M294 82 L294 54 M285 63 L294 53 L303 63" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  ${T(45.5,120,22,'1',{fill:'#0D6A46'})}${T(128.5,120,22,'2',{fill:'#0D6A46'})}${T(211.5,120,22,'3',{fill:'#0D6A46'})}${T(294.5,120,22,'4',{fill:'#0D6A46'})}
  ${T(45.5,146,11,'SAFE')}${T(128.5,146,11,'ON TIME')}${T(211.5,146,11,'RECORDING')}${T(294.5,146,11,'ON ROUTE')}
  ${T(170,188,13,'The four things that matter most')}
</svg>`;
CARDS.push({t:"Remember these 4", s:S.keys, keys:true, lead:"Before the quiz, remember the four things that matter most."});

// ---------- quiz pictures: set the scene, never show the answer ----------
const QSKY = `<rect width="340" height="160" fill="#D7ECF4"/>`;
const QROAD = (y=112) => `<rect y="${y}" width="340" height="${160-y}" fill="#3A4240"/><rect y="${y}" width="340" height="4" fill="#59625F"/>`;
const QMARK = (x,y) => `<g class="pop" style="animation-duration:3s"><circle cx="${x}" cy="${y}" r="18" fill="#FFFFFF" stroke="#1B2220" stroke-width="2.5"/>${T(x,y+8,22,'?',{fill:'#E8553E'})}</g>`;
const QS = [
  // 1 where to mount: empty windscreen, the two cameras waiting in a box
  `<svg viewBox="0 0 340 160" role="img" aria-label="An empty windscreen and two cameras waiting to be mounted"><rect width="340" height="160" fill="#2A322F"/>
    <path d="M30 128 L60 14 Q170 2 280 14 L310 128 Z" fill="#BFE0EE" stroke="#1B2220" stroke-width="4"/>
    <path d="M70 128 L152 84 L188 84 L270 128 Z" fill="#59625F"/><line x1="170" y1="88" x2="170" y2="128" stroke="#F2C230" stroke-width="4" stroke-dasharray="10 8"/>
    <rect x="148" y="12" width="44" height="14" rx="5" fill="#56625D" stroke="#1B2220" stroke-width="2.5"/>
    <rect y="128" width="340" height="32" fill="#1B2220"/>

    ${QMARK(220,62)}</svg>`,
  // 2 when can you start: car at the start point, both screens unknown
  `<svg viewBox="0 0 340 160" role="img" aria-label="A car at its start point and two camera screens">${QSKY}${QROAD()}
    <g><rect x="34" y="50" width="5" height="62" fill="#56625D"/><rect x="14" y="28" width="46" height="26" rx="5" fill="#0D6A46" stroke="#1B2220" stroke-width="2.5"/>${T(37,46,12,'START',{fill:'#FFFFFF'})}</g>
    <use href="#car" x="70" y="88" width="96" height="49"/>
    ${[196,266].map((x,i)=>`<g><rect x="${x}" y="22" width="62" height="44" rx="7" fill="#1B2220"/>${T(x+31,52,22,'?',{fill:'#F2C230'})}${T(x+31,82,11,'CAM '+(i+1))}</g>`).join('')}
    ${QMARK(150,40)}</svg>`,
  // 3 how to stop: recording screen and three things you could touch
  `<svg viewBox="0 0 340 160" role="img" aria-label="A recording camera screen, an adapter plug, an SD card and a settings icon">${QSKY}
    <g><rect x="120" y="10" width="100" height="56" rx="8" fill="#1B2220"/><circle cx="140" cy="38" r="7" fill="#E5333B" class="blink"/>${T(180,44,16,'REC',{fill:'#FFFFFF',mono:1})}</g>
    ${QMARK(250,36)}
    ${[30,135,240].map(x=>`<rect x="${x}" y="80" width="70" height="70" rx="10" fill="#FFFFFF" stroke="#1B2220" stroke-width="2.5"/>`).join('')}
    <g><rect x="45" y="104" width="30" height="18" rx="4" fill="#F6D365" stroke="#1B2220" stroke-width="2.5"/><rect x="38" y="108" width="9" height="10" rx="2" fill="#C9D2CE" stroke="#1B2220" stroke-width="2"/><path d="M75 109 L88 104 M75 117 L88 122" stroke="#1B2220" stroke-width="3" stroke-linecap="round"/></g>
    <g><path d="M155 92 L176 92 L184 100 L184 138 L155 138 Z" fill="#4A90C8" stroke="#1B2220" stroke-width="2.5" stroke-linejoin="round"/>${T(169.5,126,12,'SD',{fill:'#FFFFFF'})}</g>
    <g class="spin" style="transform-origin:275px 115px;animation-duration:8s"><circle cx="275" cy="115" r="16" fill="#C9D2CE" stroke="#1B2220" stroke-width="2.5"/>${[0,1,2,3,4,5].map(k=>{const a=k*Math.PI/3;return `<rect x="${275+Math.cos(a)*18-4}" y="${115+Math.sin(a)*18-4}" width="8" height="8" rx="1.5" fill="#C9D2CE" stroke="#1B2220" stroke-width="2"/>`}).join('')}<circle cx="275" cy="115" r="6" fill="#FFFFFF" stroke="#1B2220" stroke-width="2"/></g></svg>`,
  // 4 when to photo the odometer: odometer, phone, clock
  `<svg viewBox="0 0 340 160" role="img" aria-label="An odometer, a phone camera and a clock"><rect width="340" height="160" fill="#2A322F"/>
    <rect x="20" y="52" width="150" height="54" rx="8" fill="#0E1211" stroke="#59625F" stroke-width="3"/>
    ${'04731'.split('').map((d,i)=>`<rect x="${30+i*26}" y="62" width="22" height="34" rx="3" fill="#2A322F"/>${T(41+i*26,86,20,d,{fill:'#F2F2F2',mono:1})}`).join('')}
    ${T(95,126,11,'KM',{fill:'#9CA8A3',mono:1})}
    <g><rect x="190" y="24" width="56" height="100" rx="10" fill="#E8553E" stroke="#1B2220" stroke-width="3"/><rect x="196" y="34" width="44" height="66" rx="4" fill="#0E1211"/><circle cx="218" cy="112" r="6" fill="#FFFFFF" stroke="#1B2220" stroke-width="2"/></g>
    <g><circle cx="290" cy="74" r="28" fill="#FFFFFF" stroke="#1B2220" stroke-width="3"/><line x1="290" y1="74" x2="290" y2="56" stroke="#1B2220" stroke-width="3.5" stroke-linecap="round" class="spin" style="transform-origin:290px 74px"/><circle cx="290" cy="74" r="3" fill="#1B2220"/></g>
    ${QMARK(290,130)}</svg>`,
  // 5 time is up between A and B
  `<svg viewBox="0 0 340 160" role="img" aria-label="Time is up while the car is halfway from A to B">${QSKY}${QROAD()}<line x1="0" y1="138" x2="340" y2="138" stroke="#F2C230" stroke-width="4" stroke-dasharray="20 12"/>
    <g><rect x="40" y="52" width="5" height="60" fill="#56625D"/><circle cx="42" cy="46" r="20" fill="#0D6A46" stroke="#1B2220" stroke-width="3"/>${T(42,54,22,'A',{fill:'#FFFFFF'})}</g>
    <g><rect x="296" y="52" width="5" height="60" fill="#56625D"/><circle cx="298" cy="46" r="20" fill="#FFFFFF" stroke="#0D6A46" stroke-width="4"/>${T(298,54,22,'B',{fill:'#0D6A46'})}</g>
    <g class="bob"><use href="#car" x="128" y="96" width="84" height="43"/></g>
    <g><rect x="118" y="20" width="104" height="34" rx="10" fill="#FFFFFF" stroke="#1B2220" stroke-width="2.5"/>${T(170,42,13,"TIME'S UP!",{fill:'#E8553E'})}</g>
    <path d="M222 112 L250 112 M242 106 L250 112 L242 118" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  // 6 slow traffic
  `<svg viewBox="0 0 340 160" role="img" aria-label="Slow traffic, cars close together">${QSKY}${QROAD(100)}<line x1="-40" y1="140" x2="380" y2="140" stroke="#F2C230" stroke-width="4" stroke-dasharray="20 12" class="lane-slow"/>
    <g class="jam"><use href="#car2" x="-10" y="80" width="90" height="46"/></g>
    <g class="bob"><use href="#car" x="88" y="80" width="90" height="46"/></g>
    <g class="jam"><use href="#car2" x="186" y="80" width="90" height="46"/></g>
    <g class="jam"><use href="#car2" x="284" y="80" width="90" height="46"/></g>
    <g><rect x="18" y="16" width="120" height="34" rx="10" fill="#FFFFFF" stroke="#1B2220" stroke-width="2.5"/>${T(78,38,12,'SLOW TRAFFIC')}</g>
    ${QMARK(160,32)}</svg>`,
  // 7 road closed ahead
  `<svg viewBox="0 0 340 160" role="img" aria-label="A road closed sign ahead on the route">${QSKY}${QROAD()}<line x1="0" y1="138" x2="340" y2="138" stroke="#F2C230" stroke-width="4" stroke-dasharray="20 12"/>
    <g><rect x="220" y="74" width="104" height="20" fill="#FFFFFF" stroke="#1B2220" stroke-width="3"/>${[0,1,2,3,4].map(i=>`<path d="M${226+i*20} 74 L${238+i*20} 74 L${230+i*20} 94 L${218+i*20} 94 Z" fill="#E5333B"/>`).join('')}
      <rect x="228" y="94" width="6" height="26" fill="#1B2220"/><rect x="310" y="94" width="6" height="26" fill="#1B2220"/>
      <rect x="226" y="32" width="92" height="36" rx="5" fill="#F2C230" stroke="#1B2220" stroke-width="3"/>${T(272,48,12,'ROAD')}${T(272,63,12,'CLOSED')}</g>
    <g class="jam"><use href="#car" x="40" y="96" width="96" height="49"/></g>
    ${QMARK(170,44)}</svg>`,
  // 8 no answer from supervisor
  `<svg viewBox="0 0 340 160" role="img" aria-label="Calling the supervisor, no answer">${QSKY}
    <g><rect x="40" y="12" width="76" height="136" rx="14" fill="#1B2220"/><rect x="47" y="26" width="62" height="108" rx="6" fill="#FFFFFF"/>
      <circle cx="78" cy="56" r="14" fill="#C9D2CE"/><path d="M60 92 Q78 72 96 92" fill="#C9D2CE"/>${T(78,110,9,'SUPERVISOR')}
      <g class="blink">${T(78,126,12,'calling…',{fill:'#56625D'})}</g></g>
    <g><rect x="150" y="40" width="140" height="44" rx="12" fill="#FFFFFF" stroke="#1B2220" stroke-width="2.5"/>${T(220,68,15,'NO ANSWER',{fill:'#E8553E'})}</g>
    ${QMARK(220,122)}</svg>`
];

const QUIZ = [
  {q:"Where do you mount the two cameras?", o:["On the dashboard, wherever they fit","At the top of the windscreen, in the middle","In the bottom corner of the windscreen"], a:1,
   why:"Top of the windscreen, in the middle, lenses facing forward. They must be stable and not block your view."},
  {q:"When can you start driving?", o:["As soon as the adapter is plugged in","After you have driven for a minute","When both screens show REC and a red dot"], a:2,
   why:"Check both cameras. If one is not recording, the video for that time is lost."},
  {q:"How do you stop recording?", o:["Unplug the adapter","Take out the SD card","Turn the camera off in the settings"], a:0,
   why:"Just unplug the adapter. Never touch the SD card."},
  {q:"When do you take odometer photos?", o:["Only at the end of the day","Before and after each survey session","Only if your supervisor asks"], a:1,
   why:"Before each session starts and after it ends. Send them to your supervisor."},
  {q:"You started at A. The time is up while you are on the way to B. What do you do?", o:["Stop where you are","Turn around halfway and go back to A","Drive to B, then back to A, and write down the time you get back to A"], a:2,
   why:"Finish where you started. Keep following your route back to your start point, then write down the time."},
  {q:"The traffic is very slow. What do you do?", o:["Keep going on your route","Take a faster road","Stop and wait for the traffic to clear"], a:0,
   why:"Traffic jams are normal at busy times. They are part of the data. Keep going."},
  {q:"A road on your route is closed. What do you do?", o:["Take a new route for the rest of the session","Stop safely, tell your supervisor and wait for their OK","Finish early and go home"], a:1,
   why:"Report it and wait for OK. Then go around only the closed part, and keep the rest of your route the same."},
  {q:"Your supervisor doesn't answer the phone. What do you do?", o:["Message the team group chat","Keep calling while you drive","Stop the survey"], a:0,
   why:"Someone in the group chat will reply. Stop in a safe place before you message."}
];

const N = CARDS.length, Q = QUIZ.length;
const view = document.getElementById('view');
const backBtn = document.getElementById('backBtn');
let step = 0;               // 0 start, 1..N cards, N+1 quiz, N+2 name, N+3 done
let qi = 0, quizStarted = false, name = '';
const sel = Array(Q).fill(null), sub = Array(Q).fill(false), ok = Array(Q).fill(false);
const nCorrect = ()=>ok.filter(Boolean).length;
const allCorrect = ()=>nCorrect()===Q;
// next question that is not yet correct: first after `from`, then wrap to the start; -1 when all are correct
function nextTarget(from){ for(let k=from+1;k<Q;k++) if(!ok[k]) return k; for(let k=0;k<=from;k++) if(!ok[k]) return k; return -1; }

function progress(){
  let p, label;
  if(step===0){p=0;label='About 5 minutes';}
  else if(step<=N){p=step/(N+2);label=`Card ${step} of ${N}`;}
  else if(step===N+1){p=(N+2*nCorrect()/Q)/(N+2);label=`Quiz · ${nCorrect()} of ${Q} correct`;}
  else {p=1;label='Finished';}
  document.getElementById('count').textContent = label;
  document.getElementById('done').style.width = `calc((100% - 16px) * ${p})`;
  document.getElementById('pcar').style.left = `calc(4px + (100% - 34px) * ${p})`;
  backBtn.hidden = step===0;
}
// Animations always play, even with Reduce Motion on (owner's choice). The .rm rules stay unused.
function paint(html){ view.innerHTML = html; progress(); const f = view.querySelector('[data-focus]'); if(f) f.focus({preventScroll:true}); }

backBtn.onclick = ()=>{
  if(step<=N) step--;                                   // card k -> k-1, card 1 -> start
  else if(step===N+1){ if(qi>0) qi--; else step=N; }    // question k -> k-1, question 1 -> last card
  else if(step===N+2){ step=N+1; qi=Q-1; }              // name -> last question
  else step=N+2;                                        // done -> name
  render();
};

function renderStart(){
  paint(`<section class="card">
    <div class="eyebrow">Before your first drive</div>
    <div class="scene">${S.job}</div>
    <div class="sign">Dash Cam Drive Guide</div>
    <p class="lead">The rules for every dash cam survey drive. Read ${N} short cards, then answer ${Q} quick questions.</p>
    <div class="eyebrow">The four things that matter most</div>
    ${keyList()}
    <div class="chips"><span class="chip">${N} cards</span><span class="chip">${Q} questions</span><span class="chip">≈ 5 min</span></div>
    <p class="note">Your supervisor will give you the details for your job: your route, your times and who to contact. If your supervisor tells you something different, follow your supervisor.</p>
  </section>
  <div class="nav"><button class="primary" id="go" data-focus>Start</button></div>`);
  document.getElementById('go').onclick = ()=>{step=1;render();};
}

function renderCard(){
  const c = CARDS[step-1];
  const last = step===N;
  const nextLabel = !last ? 'Next' : allCorrect() ? 'Back to the finish' : quizStarted ? 'Back to the quiz' : 'Start the quiz';
  paint(`<section class="card">
    <div class="eyebrow">Card ${step} of ${N}</div>
    <h1 class="sign" tabindex="-1" data-focus>${c.t}</h1>
    <div class="scene" ${c.tap?'id="pw" data-on="0"':''}${c.choose?'id="fs" data-start="A"':''}>${c.s}${c.tap?'<div class="hint"><button class="tap" id="plugBtn" aria-pressed="false">Tap to plug in</button></div>':''}</div>
    ${c.choose?'<div class="seg" role="group" aria-label="Choose your start point"><span>Where do you start?</span><button class="tap" type="button" data-s="A" aria-pressed="true">A</button><button class="tap" type="button" data-s="B" aria-pressed="false">B</button></div>':''}
    ${c.lead?`<p class="lead">${c.lead}</p>`:''}
    ${c.keys ? keyList() : `<ul class="pts">${c.pts.map(p=>`<li>${p}</li>`).join('')}</ul>`}
  </section>
  <div class="nav"><button class="primary" id="next">${nextLabel}</button></div>`);
  if(c.tap){
    const pw=document.getElementById('pw'), b=document.getElementById('plugBtn');
    const toggle=()=>{const on=pw.dataset.on==='1'?'0':'1';pw.dataset.on=on;b.textContent=on==='1'?'Tap to unplug':'Tap to plug in';b.setAttribute('aria-pressed',on==='1');};
    b.onclick=toggle; pw.querySelector('svg').addEventListener('click',toggle);
  }
  if(c.choose){
    const fs=document.getElementById('fs');
    view.querySelectorAll('.seg .tap').forEach(b=>b.onclick=()=>{
      fs.dataset.start=b.dataset.s;
      view.querySelectorAll('.seg .tap').forEach(x=>x.setAttribute('aria-pressed', x===b));
    });
  }
  document.getElementById('next').onclick = ()=>{
    step++;
    if(step===N+1){ quizStarted=true; if(allCorrect()) step = name ? N+3 : N+2; }
    render();
  };
}

function renderQuiz(){
  const q = QUIZ[qi];
  paint(`<section class="card">
    <div class="qhead"><div class="eyebrow">Question ${qi+1} of ${Q}</div><button class="ghost small" id="reset" type="button">Reset</button></div>
    <h1 class="sign" tabindex="-1" data-focus style="font-size:22px">${q.q}</h1>
    <div class="scene">${QS[qi]}</div>
    <p class="note" id="howto">Tap an answer, then tap Check answer.</p>
    <div class="opts" role="radiogroup" aria-labelledby="howto">${q.o.map((t,k)=>`<button class="opt" type="button" role="radio" data-k="${k}">${t}</button>`).join('')}</div>
    <div id="fb"></div>
  </section>
  <div class="nav"><button class="primary" id="next" type="button"></button></div>`);
  const nx=document.getElementById('next'), rs=document.getElementById('reset'), fb=document.getElementById('fb');
  function update(){
    view.querySelectorAll('.opt').forEach(x=>{
      const k=+x.dataset.k;
      x.classList.toggle('sel', sel[qi]===k && !sub[qi]);
      x.classList.toggle('right', sub[qi] && k===q.a);
      x.classList.toggle('wrong', sub[qi] && k===sel[qi] && k!==q.a);
      x.setAttribute('aria-checked', sel[qi]===k);
      x.disabled = sub[qi];
    });
    fb.innerHTML = !sub[qi] ? '' : ok[qi]
      ? `<p class="fb ok"><b>Right.</b>${q.why}</p>`
      : `<p class="fb bad"><b>Not quite.</b>${q.why} Tap Reset to try again now, or go on and answer it again at the end.</p>`;
    if(!sub[qi]){ nx.textContent='Check answer'; nx.disabled = sel[qi]===null; }
    else { nx.disabled=false; nx.textContent = nextTarget(qi)===-1 ? 'Finish' : 'Next question'; }
    rs.hidden = sel[qi]===null && !sub[qi];
    rs.classList.toggle('alert', sub[qi] && !ok[qi]);
    progress();
  }
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(sub[qi]) return; sel[qi]=+b.dataset.k; update(); });
  nx.onclick=()=>{
    if(!sub[qi]){ if(sel[qi]===null) return; sub[qi]=true; ok[qi]=sel[qi]===q.a; update(); nx.focus(); return; }
    const t=nextTarget(qi);
    if(t===-1){ step=N+2; render(); return; }
    qi=t; if(sub[qi] && !ok[qi]){ sub[qi]=false; sel[qi]=null; }   // a missed question comes back fresh
    render();
  };
  rs.onclick=()=>{ sel[qi]=null; sub[qi]=false; ok[qi]=false; update(); };
  update();
}

function renderName(){
  paint(`<section class="card">
    <div class="eyebrow">All ${Q} questions right</div>
    <h1 class="sign">Well done</h1>
    <p class="lead">Type your full name to finish.</p>
    <form id="nf" style="display:flex;flex-direction:column;gap:8px">
      <label for="nm">Your full name</label>
      <input type="text" id="nm" autocomplete="name" required data-focus>
      <button class="primary" type="submit">I have read and understood the rules</button>
    </form>
  </section>`);
  document.getElementById('nm').value = name;
  document.getElementById('nf').addEventListener('submit',e=>{
    e.preventDefault(); const v=document.getElementById('nm').value.trim(); if(!v) return; name=v; step=N+3; render();
  });
}

function renderDone(){
  const when = new Date().toLocaleString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'});
  paint(`<section class="card">
    <div class="cert">
      <svg class="tick" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="var(--sign)"/><path d="M16 29 L25 38 L41 20" fill="none" stroke="var(--sign-ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="eyebrow">Dash Cam Drive Guide · completed</div>
      <div class="who" id="who" tabindex="-1" data-focus></div>
      <div>has read the rules and answered all ${Q} questions correctly.</div>
      <div class="when">${when}</div>
    </div>
    <p class="lead"><strong>Take a screenshot of this card and send it to your supervisor.</strong></p>
    <p class="note">This page does not send anything by itself.</p>
  </section>`);
  document.getElementById('who').textContent = name;
}

function render(){
  if(step===0) renderStart();
  else if(step<=N) renderCard();
  else if(step===N+1) renderQuiz();
  else if(step===N+2) renderName();
  else renderDone();
  window.scrollTo({top:0});
}
render();
})();
</script>

</html>
